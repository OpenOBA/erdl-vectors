name: ERDL Vectors v1.5 Verification

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'decision-object-vectors-v1.5.json'
      - 'scripts/**'
      - 'test/**'
      - 'submissions/**'
      - '.github/workflows/verify-v1.5.yml'
      - 'package.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean-Room Check (zero-dependency verifier)
        run: |
          # 检查 verify-v1.5.js 源码是否引入 json-canonicalize（而非环境可导入性）
          if grep -q "require('json-canonicalize')" scripts/verify-v1.5.js; then
            echo "FAIL: verifier depends on json-canonicalize"
            exit 1
          fi
          echo "PASS: zero-dependency clean-room verifier (source-level check)"

      - name: Install dependencies
        run: npm install

      - name: Determinism check (regenerate + byte-identical diff)
        run: |
          node scripts/generate-v1.5.cjs
          if ! git diff --exit-code decision-object-vectors-v1.5.json; then
            echo "FAIL: regeneration produced different vectors (non-deterministic)"
            exit 1
          fi
          echo "PASS: byte-identical deterministic regeneration"

      - name: Verify (Step 0-6, dual check)
        run: |
          node scripts/verify-v1.5.js decision-object-vectors-v1.5.json --answers decision-object-answers-v1.5.json

      - name: Generate CONFORMANCE.md (auto-record)
        run: |
          node scripts/generate-conformance.cjs
          if ! git diff --exit-code conformance/CONFORMANCE.md; then
            echo "FAIL: CONFORMANCE.md is stale — commit the regenerated report"
            exit 1
          fi
          echo "PASS: CONFORMANCE.md is current"

      - name: Cross-verify runner submissions (hash-layer + expression-layer)
        run: |
          if ls submissions/*.json >/dev/null 2>&1; then
            for f in submissions/*.json; do
              layer=$(node -e "const s=require('./' + process.argv[1]); process.stdout.write(s.layer || 'audit')" "$f")
              if [ "$layer" = "expression" ]; then
                echo "=== Cross-verifying expression-layer $f ==="
                node scripts/verify-v-engine-submission.mjs --submission "$f" || exit 1
              else
                echo "=== Cross-verifying hash-layer $f ==="
                node scripts/verify-submission.cjs --submission "$f" || exit 1
              fi
            done
          else
            echo "No runner submissions to cross-verify (only README.md present)."
          fi

      - name: Generate V-ENGINE vectors + answers (oracle isolation)
        run: npm run generate:vengine

      - name: V-ENGINE determinism check
        run: |
          if ! git diff --exit-code v-engine-vectors.json; then
            echo "FAIL: V-ENGINE regeneration produced different vectors (non-deterministic)"
            exit 1
          fi
          echo "PASS: V-ENGINE byte-identical deterministic regeneration"

      - name: Run tests (vitest)
        run: npm test
