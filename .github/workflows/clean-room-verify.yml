name: ERDL Decision Object Clean-Room Verification

on:
  push:
    branches: [master, main]
  pull_request:
    paths:
      - 'decision-object-vectors-v1.3.json'
      - 'scripts/verify.js'
      - 'scripts/reference-runner.js'
      - '.github/workflows/clean-room-verify.yml'
      - 'submissions/*.json'
  workflow_dispatch:

jobs:
  clean-room-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean-Room Check (SDK absence)
        run: |
          if npm list @openoba-ai/erdl-mcp 2>/dev/null | grep -q "@openoba-ai/erdl-mcp"; then
            echo "FAIL: ERDL SDK is importable"
            exit 1
          fi
          if node -e "require('@openoba-ai/erdl-mcp')" 2>/dev/null; then
            echo "FAIL: ERDL SDK resolved at runtime"
            exit 1
          fi
          echo "PASS: ERDL SDK not importable"

      - name: Install dependencies
        run: npm install

      - name: Check 1 - Audit Hash Self-Consistency
        run: node scripts/verify.js decision-object-vectors-v1.3.json

      - name: Check 2 - Answers File Cross-Comparison
        run: |
          if [ -f decision-object-answers-v1.3.json ]; then
            node scripts/verify.js decision-object-vectors-v1.3.json --answers decision-object-answers-v1.3.json
          else
            echo "WARNING: Answers file not found - skipping Check 2 (local-only, never committed)"
          fi

      - name: Generate CONFORMANCE.md
        run: |
          if [ -f decision-object-answers-v1.3.json ]; then
            node scripts/verify.js decision-object-vectors-v1.3.json --answers decision-object-answers-v1.3.json --ci
          else
            node scripts/verify.js decision-object-vectors-v1.3.json --ci
          fi

      - name: Commit CONFORMANCE.md (if changed)
        run: |
          if ! git diff --exit-code conformance/CONFORMANCE.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add conformance/CONFORMANCE.md
            git commit -m "ci: update CONFORMANCE.md [skip ci]"
            git push || echo "WARNING: git push failed (non-blocking)"
          fi

      - name: Cross-verify runner submissions
        if: hashFiles('submissions/*.json') != ''
        run: |
          for f in submissions/*.json; do
            [ -f "$f" ] || continue
            echo "Checking: $f"
            node scripts/verify.js decision-object-vectors-v1.3.json "$f"
          done
